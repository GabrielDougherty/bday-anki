name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos-normal:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2
    
    - name: Build with Zig (normal)
      run: zig build
    
    - name: Upload build artifacts (normal)
      uses: actions/upload-artifact@v4
      with:
        name: bdays-macos-normal
        path: zig-out/bin/bdays
        retention-days: 30
